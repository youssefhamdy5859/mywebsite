name: Build Prayer APK
on:
  push:
    branches: [chatgpt-prayer-apk-build]
    paths:
      - 'android-prayer-overlay/**'
      - '.github/workflows/build-prayer-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-prayer-overlay/**'
      - '.github/workflows/build-prayer-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: android-prayer-overlay
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp android-prayer-overlay/app/build/outputs/apk/debug/app-debug.apk RiyadhPrayerReminder.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RiyadhPrayerReminder-APK
          path: RiyadhPrayerReminder.apk
          if-no-files-found: error
