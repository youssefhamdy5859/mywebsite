name: Build Muhasabah APK

on:
  push:
    branches:
      - muhasabah-apk-build
    paths:
      - 'muhasabah-build/**'
      - '.github/workflows/muhasabah-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          cat muhasabah-build/part*.b64 | tr -d '\n\r' | base64 -d > MuhasabahNafs_build_ready.zip
          echo "c3fce145f328d7d4bd321be9d91d3e92c8b7dcb38c68ee95b1c6431647d85e2f  MuhasabahNafs_build_ready.zip" | sha256sum -c -
          unzip -q MuhasabahNafs_build_ready.zip
          test -f MuhasabahNafs/app/build.gradle.kts

      - name: Fix Android vector XML namespaces
        shell: bash
        run: |
          sed -i 's#http://schemas.android.com/apk/res/vector#http://schemas.android.com/apk/res/android#g' \
            MuhasabahNafs/app/src/main/res/drawable/ic_launcher_background.xml \
            MuhasabahNafs/app/src/main/res/drawable/ic_launcher_foreground.xml
          grep -R "schemas.android.com/apk/res/android" MuhasabahNafs/app/src/main/res/drawable/ic_launcher_*.xml
          sed -i 's#@mipmap/ic_launcher_foreground#@drawable/ic_launcher_foreground#g' \
            MuhasabahNafs/app/src/main/res/drawable/splash_background.xml
          grep -n "ic_launcher_foreground" MuhasabahNafs/app/src/main/res/drawable/splash_background.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build installable APK
        working-directory: MuhasabahNafs
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -f MuhasabahNafs/app/build/outputs/apk/debug/app-debug.apk
          ls -lh MuhasabahNafs/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuhasabahNafs-installable-apk
          path: MuhasabahNafs/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
